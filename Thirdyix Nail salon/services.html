<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Services & Pricing - PinkieBabe Nails</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #e8a5b8; 
            --secondary-color: #fcf8f6; 
            --text-color: #4a4a4a;
            --accent-color: #9e6d7d;
            --font-family: 'Cormorant Garamond', serif;
        }
        body { font-family: var(--font-family); font-size: 1.6875rem; margin: 0; padding: 0; background-color: var(--secondary-color); color: var(--text-color); line-height: 1.6; }
        header { background-color: #ffffff; text-align: center; padding: 1.5rem 1rem; border-bottom: 2px solid #f0e4e6; }
        header h1 { margin: 0; color: var(--accent-color); font-size: clamp(3rem, 7.5vw, 3.75rem); }
        header p { margin-top: 0.5rem; font-style: italic;}
        nav { background-color: var(--primary-color); text-align: center; padding: 0.8rem; }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; font-size: 1.575rem; }
        nav a.active { text-decoration: underline; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        section { background: #ffffff; margin-bottom: 20px; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { color: var(--accent-color); border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; font-size: 2.4rem; }
        .service-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .service-card { border: 1px solid #eee; padding: 15px; border-radius: 6px; background-color: #fffafb; }
        footer { text-align: center; padding: 15px; background-color: var(--accent-color); color: white; margin-top: 30px; }
        nav a:hover, nav a.active {
            opacity: 0.85;
        }

        .img-containers {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .img-containers img {
            border-radius: 8px;
            display: block;
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .logo-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            margin-bottom: 1rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <header>
        <img src="Logo Nail salon.jpg" alt="PinkieBabe Nails Logo" class="logo-img" />
        <h1>PinkieBabe Nails</h1>
        <p>Home-Service Nail Tech</p>
        <p><small>Owner: Elaine Navarro Reyes</small></p>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html" class="active">Services & Pricing</a>
        <a href="contact.html">Book Now / Contact</a>
    </nav>
    <div class="container">
        <section>
            <h3>Services Offered</h3>
            <div class="service-list">
                <div class="service-card">
                    <h4>Nail Care</h4>
                    <p>Manicure & Pedicure with quality polish and relaxation care.</p>
                </div>
            </div>

            <div class="img-containers">
                <img src="/Thirdyix Nail salon/nails1.jpg" alt="">
                <img src="/Thirdyix Nail salon/nails2.jpg" alt="">
                <img src="/Thirdyix Nail salon/nails3.jpg" alt="">
                <img src="/Thirdyix Nail salon/nails4.jpg" alt="">
            </div>
        </section>
    </div>
    <footer>
        <p>&copy; 2026 Group 6 Website Salon. All Rights Reserved.</p>
    </footer>
</body>
</html>
